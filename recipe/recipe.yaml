schema_version: 1

context:
  name: packer
  version: "1.16.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/hashicorp/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: de0fb9c389dee6acc24d07ae2af02a3f6c30710cba474646325371cf0d62bc78

build:
  number: 0
  script:
    - if: unix
      then:
        - mkdir -p "$PREFIX/bin"
        - go build -v -ldflags "-w -s -X github.com/hashicorp/packer/version.VersionPrerelease=" -o "$PREFIX/bin/packer"
    - if: win
      then:
        - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
        - go build -v -ldflags "-w -s -X github.com/hashicorp/packer/version.VersionPrerelease=" -o "%LIBRARY_BIN%\packer.exe"
    - go-licenses save . --save_path ./library_licenses || true

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('go') }}
    - go-licenses

tests:
  - package_contents:
      bin:
        - packer
  - script:
      - packer -v

about:
  homepage: https://www.packer.io
  documentation: https://www.packer.io/docs
  repository: https://github.com/hashicorp/packer
  license: BUSL-1.1
  license_file:
    - LICENSE
    - library_licenses/
  summary: Build Automated Machine Images.
  description: >-
    HashiCorp Packer is easy to use and automates the creation of any type
    of machine image. It embraces modern configuration management by
    encouraging you to use automated scripts to install and configure the
    software within your Packer-made images.

extra:
  recipe-maintainers:
    - sodre
    - mariusvniekerk
    - dhirschfeld
    - dbast
